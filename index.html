<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08130F">
<title>Only Today</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #05100C; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    color: #fff; overflow: hidden;
  }
  #root { width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; }
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(ellipse 110% 58% at 50% 0%, #123F37 0%, transparent 60%), linear-gradient(180deg, #08130F, #05100C);
    transition: opacity .35s ease;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash .dot {
    width: 54px; height: 54px; border-radius: 18px;
    background: linear-gradient(135deg, #2FDF9E, #12B981);
    box-shadow: 0 10px 30px rgba(47,223,158,0.35);
    animation: pulse 1.2s ease-in-out infinite;
  }
  #splash .t { font-size: 15px; letter-spacing: .5px; color: rgba(255,255,255,0.62); }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.86); opacity: .6; } }
</style>
<script>window.nativelyOnLoad = window.nativelyOnLoad || function () {};</script>
<script async onload="nativelyOnLoad()" src="https://cdn.jsdelivr.net/npm/natively@2.26.0/natively-frontend.min.js"></script>
<script>
/* ── РЕКЛАМА AdMob ───────────────────────────────────────────────────────────
   Работает только в собранном приложении. В браузере SDK нет — весь модуль
   тихо ничего не делает, приложение при этом работает как раньше.

   ВНИЗУ ДВА ID. Баннер боевой. Межстраничный пока ТЕСТОВЫЙ —
   замени на свой, когда создашь блок в AdMob.                              */

window.OT_ADS = (function () {
  var BANNER_ANDROID       = "ca-app-pub-1286571991466831/8828247168";
  var INTERSTITIAL_ANDROID = "ca-app-pub-1286571991466831/4870664165";

  var banner = null, inter = null, interReady = false;

  function initBanner() {
    try {
      banner = new NativelyAdmobBanner(
        { androidUnitId: BANNER_ANDROID, position: "BOTTOM", sizeType: "AUTO" },
        function () {}, true, function () {}, true, function () {}
      );
    } catch (e) {}
  }

  function initInterstitial() {
    try {
      inter = new NativelyAdmobInterstitial(
        INTERSTITIAL_ANDROID, INTERSTITIAL_ANDROID,
        function (resp) {
          if (!resp) return;
          if (resp.event === "DID_LOAD_AD") interReady = true;
          if (resp.event === "DID_SHOW_AD") interReady = false;
          if (resp.event === "DID_DISMISS_AD" && window.OT_ADS._onDone) {
            var cb = window.OT_ADS._onDone; window.OT_ADS._onDone = null; cb();
          }
        },
        true, function () {}
      );
    } catch (e) {}
  }

  return {
    _onDone: null,
    init: function () {
      if (typeof NativelyAdmobBanner === "undefined") return;
      initBanner();
      initInterstitial();
    },
    /* Показать межстраничную. onDone срабатывает РОВНО ОДИН раз:
       после закрытия ролика, при возврате в приложение, по таймауту,
       или сразу — если рекламы нет. Человек не должен остаться без бонуса
       из-за того, что свернул приложение или реклама не загрузилась.       */
    showInterstitial: function (onDone) {
      var fired = false;
      var finish = function () {
        if (fired) return;
        fired = true;
        window.OT_ADS._onDone = null;
        try { document.removeEventListener("visibilitychange", onBack); } catch (e) {}
        if (onDone) onDone();
      };
      var onBack = function () {
        if (document.visibilityState === "visible") setTimeout(finish, 300);
      };
      if (!inter || !interReady) { finish(); return; }
      this._onDone = finish;
      try { document.addEventListener("visibilitychange", onBack); } catch (e) {}
      setTimeout(finish, 90000); /* крайний случай: ролик завис */
      try { inter.showInterstitialAd(); }
      catch (e) { finish(); }
    }
  };
})();

(function () {
  var prev = window.nativelyOnLoad;
  window.nativelyOnLoad = function () {
    try { if (typeof prev === "function") prev(); } catch (e) {}
    try { window.OT_ADS.init(); } catch (e) {}
  };
})();
</script>

    { id: "selflove", emoji: "🤲", tag: "Личность", title: "Любовь к себе",
        body: "Любовь к себе в выздоровлении — это не «баловать себя» и не оправдания. Это восстановление отношения к себе, разрушенного стыдом, виной и травмой.\n\nФормула: забота плюс уважение плюс честность плюс ответственность.\n\nПочему у зависимых это сломано: стыдовая идентичность — «я плохой» вместо «я делал плохое». Качели самооценки. Самонаказание, которое кажется справедливостью. Потеря доверия к себе после сотни нарушенных обещаний.\n\nСтыд не помогает бросить. Стыд — топливо срыва: чем хуже человек о себе думает, тем быстрее возвращается к тому, что даёт облегчение." },
    { id: "ei", emoji: "🫀", tag: "Чувства", title: "Эмоциональный интеллект",
        body: "Умение жить со своими чувствами, а не убегать от них. Трудности с эмоциями часто и становятся причиной зависимости.\n\nКлючевая связка: ситуация → эмоция → реакция. Между событием и реакцией всегда стоит эмоция. Если она не осознана, реакция получается импульсивной, и человек искренне не понимает, почему сорвался «на ровном месте».\n\nПять составляющих: самоосознание, саморегуляция, мотивация, эмпатия, социальные навыки.\n\nОтсюда и смысл дневника чувств: не «писать про эмоции», а научиться замечать их до того, как они превратились в действие." },
    { id: "berne", emoji: "👤", tag: "Отношения", title: "Транзактный анализ",
        body: "Подход Эрика Берна: он объясняет, как люди общаются и почему повторяют одни и те же сценарии.\n\nТри состояния. РОДИТЕЛЬ — усвоенные правила и оценки: критический («ты должен», «ты слабак») и заботливый («ты справишься»). РЕБЁНОК — эмоции, желания, страхи, обиды. ВЗРОСЛЫЙ — трезвая оценка фактов здесь и сейчас.\n\nБольшинство конфликтов и срывов происходят из Ребёнка или Критического Родителя. Задача — укреплять Взрослого.\n\nПрактическая польза: когда накрывает, полезно спросить себя, кто сейчас говорит внутри — обиженный Ребёнок, обвиняющий Родитель или Взрослый." },
    { id: "mature", emoji: "🧭", tag: "Личность", title: "Зрелая личность",
        body: "Зрелость — это способность осознанно управлять своей жизнью, брать ответственность и справляться с трудностями, не разрушая себя. От возраста она не зависит.\n\nНезрелая позиция: ждёт, что кто-то решит проблемы, избегает ответственности, действует импульсивно, целиком зависит от эмоций.\n\nЗрелая позиция: осознанный выбор, ответственность за последствия, способность вытерпеть дискомфорт и действовать не по настроению.\n\nЗависимость тесно связана с эмоциональной незрелостью — и это хорошая новость: зрелость наращивается, в отличие от характера или прошлого." },
    { id: "goals", emoji: "🎯", tag: "Путь", title: "Целеполагание",
        body: "Без целей жизнь становится хаотичной, а пустое время — топливо для тяги. Поэтому цели в выздоровлении не «мотивационная мишура», а часть безопасности.\n\nЧто дают цели: направление, мотивацию, понимание, куда тратить силы, и возможность увидеть прогресс.\n\nSMART: цель должна быть конкретной, измеримой, достижимой, значимой именно для тебя и ограниченной по времени.\n\nЧастая ошибка в первые месяцы — ставить огромные цели вроде «изменить всю жизнь». Здоровее взять одну маленькую и дойти до конца: выполненная мелочь восстанавливает доверие к себе сильнее, чем брошенная большая." },
    { id: "recovery", emoji: "🌱", tag: "Восстановление", title: "Фазы восстановления организма",
        body: "Первые дни и недели тяжело — и это закономерно, а не признак того, что «ничего не выйдет».\n\nОстрая фаза, до 3–5 суток: сильная разбитость, подавленность, тянет на сладкое, сон сбит, тревога и навязчивая тяга. Организм истощил запасы радости, отсюда пустота.\n\nПодострая, 1–2 недели: усталость слабее, но держится туман в голове, забывчивость, качели настроения.\n\nПоздняя, от 2–6 недель: ясность и настроение возвращаются, остаются лёгкие нарушения сна.\n\nЧто реально помогает: ровный режим сна 7–8 часов, нормальная еда, вода, и физические нагрузки — но начинать не раньше чем через неделю, с лёгких." },
];
const LECTURES_EN = [
    { id: "bpsd", emoji: "\U0001F9EC", tag: "Illness", title: "The disease concept (BPSS)",
        body: "Addiction is a disease, not fecklessness and not depravity. It is listed in the medical classifications of diseases.\n\nAn addict is powerless over the substance because a physical illness also affects him psychologically, socially and spiritually. You cannot control how your body reacts to the substance \u2014 you can only learn to live with this illness.\n\nThat is where powerlessness in the first step comes from: this disease is not cured by willpower. Four areas are damaged \u2014 biological, psychological, social and spiritual \u2014 and all four need to recover, not just \u00abstopping using\u00bb." },
    { id: "craving", emoji: "\U0001F30A", tag: "Craving", title: "Craving and HALT",
        body: "Craving is a symptom of the illness, not a failure and not weakness. Craving does not equal using: there is always a gap between them, and that is where the decision is made.\n\nCraving behaves like a wave: it rises, peaks and falls. You don't need to fight it or run from it \u2014 you can ride it out, watching from the side. This is called urge surfing.\n\nHALT \u2014 four states in which craving gets stronger: hungry, angry, lonely, tired. When it hits, check yourself against these four: often it isn't craving as such, it's that you haven't eaten or slept." },
    { id: "paws", emoji: "\U0001F32B\uFE0F", tag: "Recovery", title: "Post-acute withdrawal",
        body: "When the physical withdrawal has passed, the nervous system is still rewiring itself. That is post-acute withdrawal.\n\nThe symptoms come in waves: easier, then worse again. Brain fog, forgetfulness, mood swings, anxiety, disturbed sleep. They get stronger under stress and lack of sleep, and can last for months.\n\nThe main thing to know: this is not weak character, it is neuropsychological instability. And it is temporary. Many people relapse right here \u2014 because they decide it will never get better. It will.\n\nThis is educational material, not a diagnosis. With severe symptoms \u2014 see a doctor." },
    { id: "compulsive", emoji: "\U0001F501", tag: "Behaviour", title: "Compulsive behaviour",
        body: "A compulsion is a repeated action a person performs not because he wants to, but because he cannot not do it.\n\nThe chain is always the same: tension \u2192 impulse \u2192 action \u2192 brief relief \u2192 consequences \u2192 even more tension. The circle closes and spins faster.\n\nHow a compulsion differs from a habit: a habit can be stopped with effort, a compulsion almost cannot. \u00abI feel bad until I do it\u00bb, and reason switches off at that moment.\n\nIt works the same way with substances and with gambling, shopping, porn, food. The form differs \u2014 the mechanism is one." },
    { id: "codep", emoji: "\U0001FAA2", tag: "Relationships", title: "Codependency",
        body: "Codependency is when a person is so involved in someone else's life that he loses contact with himself: with his own feelings, boundaries and needs.\n\nThe formula is simple: \u00abif the other person is fine, then I am fine\u00bb. This is not love. Love respects boundaries. Here there is fear, control and dissolving into another.\n\nSigns: \u00abI must save him\u00bb, \u00abhe'll be lost without me\u00bb, \u00abmy worth is in being needed\u00bb. Constant rescuing, control, guilt over other people's decisions.\n\nThe way out is not to abandon the person, but to take your own life back." },
    { id: "sub", emoji: "\U0001F3AD", tag: "Personality", title: "Sub-personalities",
        body: "A person is not a single indivisible being. Inside there is a whole crowd: psychological formations, each with its own style, motives, feelings and behaviour.\n\nThey are constantly in conflict. One part wants sobriety, another wants relief right now. One makes a promise, another breaks it. This is not split personality, this is how the psyche normally works.\n\nThe point of the work is to learn to tell which voice inside is speaking now. While the voices are fused into a single \u00abI\u00bb, a person doesn't understand who exactly made the decision to relapse.\n\nThe sub-personality tasks are built on this lecture." },
    { id: "defects", emoji: "\U0001F333", tag: "Personality", title: "Character defects: the tree metaphor",
        body: "In the twelve steps the word \u00abalcohol\u00bb appears literally once \u2014 in the first step. Everything else is about the growth of any person, addicted or not.\n\nThe tree metaphor. THE SOIL \u2014 basic needs: survival, belonging, safety, recognition, love. There are many, they are natural, there is nothing wrong with them.\n\nTHE TRUNK and BRANCHES \u2014 the ways a person meets those needs. A character defect is not the need itself, but a crooked way of meeting it.\n\nThat is why the fourth step is not self-flagellation, but discovering which crooked ways you use to get normal things." },
    { id: "change", emoji: "\U0001FA9C", tag: "The path", title: "Stages of behaviour change",
        body: "The Prochaska and DiClemente model: a person doesn't change all at once but goes through five stages, and there is a sixth \u2014 relapse.\n\n1. Precontemplation \u2014 doesn't see the problem or isn't thinking about changing. About half deny it entirely.\n2. Contemplation \u2014 admits the problem, is thinking it over.\n3. Preparation \u2014 has decided and is getting ready.\n4. Action \u2014 is changing behaviour.\n5. Maintenance \u2014 is holding the change.\n\nWhy know this: it is useless to give someone stage-four tools when he is at stage one. And it is useless to beat yourself up for \u00abthinking about it for six months without starting\u00bb \u2014 thinking before starting is normal." },
    { id: "warning", emoji: "\U0001F6A9", tag: "Relapse", title: "Warning signs of relapse",
        body: "A relapse does not begin at the moment a person uses. It begins long before \u2014 with changes in thinking, mood and behaviour.\n\nTypical warning signs: denial returns along with the thought \u00abI can control it now\u00bb; tension and irritability grow; the person drops what was helping \u2014 the diary, the tasks, the phone calls; isolation and secrecy appear; sleep goes off; self-pity accumulates.\n\nThe point is to learn to notice this at an early stage, not the last one. Using is the end of the chain, not its beginning.\n\nOnce a week it makes sense to check yourself honestly against these signs." },
    { id: "selflove", emoji: "\U0001F932", tag: "Personality", title: "Self-love",
        body: "Self-love in recovery is not \u00abtreating yourself\u00bb and not making excuses. It is restoring the relationship with yourself that shame, guilt and trauma destroyed.\n\nThe formula: care plus respect plus honesty plus responsibility.\n\nWhy this is broken in addicts: a shame identity \u2014 \u00abI am bad\u00bb instead of \u00abI did bad things\u00bb. Self-esteem swinging up and down. Self-punishment that feels like justice. Loss of trust in yourself after a hundred broken promises.\n\nShame does not help anyone quit. Shame is fuel for relapse: the worse a person thinks of himself, the faster he returns to whatever gives relief." },
    { id: "ei", emoji: "\U0001FAC0", tag: "Feelings", title: "Emotional intelligence",
        body: "The ability to live with your feelings instead of running from them. Difficulty with emotions is often what causes addiction in the first place.\n\nThe key link: situation \u2192 emotion \u2192 reaction. Between an event and a reaction there is always an emotion. If it isn't recognised, the reaction comes out impulsive, and the person genuinely doesn't understand why he relapsed \u00about of nowhere\u00bb.\n\nFive components: self-awareness, self-regulation, motivation, empathy, social skills.\n\nHence the point of the feelings diary: not to \u00abwrite about emotions\u00bb, but to learn to notice them before they turn into action." },
    { id: "berne", emoji: "\U0001F464", tag: "Relationships", title: "Transactional analysis",
        body: "Eric Berne's approach: it explains how people communicate and why they repeat the same scenarios.\n\nThree states. PARENT \u2014 absorbed rules and judgements: critical (\u00abyou must\u00bb, \u00abyou're weak\u00bb) and nurturing (\u00abyou'll manage\u00bb). CHILD \u2014 emotions, wishes, fears, resentments. ADULT \u2014 a sober assessment of the facts here and now.\n\nMost conflicts and relapses come from the Child or the Critical Parent. The task is to strengthen the Adult.\n\nPractical use: when it hits, it helps to ask yourself who is speaking inside right now \u2014 the hurt Child, the accusing Parent, or the Adult." },
    { id: "mature", emoji: "\U0001F9ED", tag: "Personality", title: "A mature personality",
        body: "Maturity is the ability to run your life consciously, take responsibility and cope with difficulty without destroying yourself. It does not depend on age.\n\nThe immature position: waits for someone else to solve the problems, avoids responsibility, acts impulsively, depends entirely on emotions.\n\nThe mature position: conscious choice, responsibility for consequences, the ability to tolerate discomfort and act regardless of mood.\n\nAddiction is closely linked to emotional immaturity \u2014 and that is good news: maturity can be built up, unlike your character or your past." },
    { id: "goals", emoji: "\U0001F3AF", tag: "The path", title: "Setting goals",
        body: "Without goals life becomes chaotic, and empty time is fuel for craving. So goals in recovery are not motivational decoration, they are part of your safety.\n\nWhat goals give you: direction, motivation, an understanding of where to spend your strength, and a way to see progress.\n\nSMART: a goal should be specific, measurable, achievable, meaningful to you personally, and time-bound.\n\nA common mistake in the first months is setting huge goals like \u00abchange my whole life\u00bb. It is healthier to take one small goal and finish it: a small thing completed restores trust in yourself far more than a big thing abandoned." },
    { id: "recovery", emoji: "\U0001F331", tag: "Recovery", title: "Phases of physical recovery",
        body: "The first days and weeks are hard \u2014 and that is natural, not a sign that \u00abnothing will work out\u00bb.\n\nAcute phase, up to 3\u20135 days: heavy exhaustion, low mood, cravings for sweets, disturbed sleep, anxiety and obsessive craving. The body has drained its reserves of joy, hence the emptiness.\n\nSub-acute, 1\u20132 weeks: the fatigue eases but brain fog, forgetfulness and mood swings remain.\n\nLate, from 2\u20136 weeks: clarity and mood return, only mild sleep problems remain.\n\nWhat actually helps: a steady sleep schedule of 7\u20138 hours, proper food, water, and physical activity \u2014 but starting no earlier than a week in, and gently." },
];

        @keyframes slideDown { from { transform: translateY(-16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        textarea, input { outline: none; }
        textarea::placeholder, input::placeholder { color: ${C.muted}; }
        button { cursor: pointer; font-family: inherit; transition: transform 0.12s ease, opacity 0.12s ease; }
        button:active { transform: scale(0.97); }
        ::-webkit-scrollbar { width: 0; }
        /* Поле даты: нативное колесо должно открываться по тапу в любое место.
           Для этого невидимый picker-indicator растянут на всё поле. */
        input[type="date"] { position: relative; }
        input[type="date"]::-webkit-date-and-time-value { text-align: center; }
        input[type="date"]::-webkit-calendar-picker-indicator {
          position: absolute; left: 0; top: 0; width: 100%; height: 100%;
          margin: 0; padding: 0; opacity: 0; cursor: pointer;
        }
      `)));

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    if (splash) { splash.classList.add("hide"); setTimeout(function () { splash.remove(); }, 400); }
  } catch (e) {
    fail('Ошибка при запуске приложения.<br><span style="font-size:13px;color:rgba(255,255,255,.5)">' +
         String(e && e.message ? e.message : e) + '</span>');
    throw e;
  }
})();
